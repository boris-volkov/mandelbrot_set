<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>self-check</title>
		<style>
			body {
				background: #05070c;
				color: #cfd8e3;
				font: 13px/1.7 ui-monospace, "Courier New", monospace;
				padding: 24px;
			}
			.pass { color: #6ec98a; }
			.fail { color: #e2657a; }
			.note { color: #7a8899; }
			h1 { font-size: 15px; font-weight: normal; color: coral; }
		</style>
	</head>
	<body>
		<h1>mandelbrot self-check</h1>
		<pre id="out">running…</pre>

		<script type="module">
			import {
				fromDecimalString,
				fromNumber,
				mul,
				precisionFor,
				toDecimalString,
				toNumber,
			} from './src/fixed.js';
			import {
				computeReference,
				directTile,
				ESCAPE_RADIUS,
				INTERIOR,
				perturbTile,
			} from './src/kernel.js';
			import { ViewState } from './src/state.js';
			import { colorize } from './src/palette.js';

			const lines = [];
			let failures = 0;

			function check(name, ok, detail = '') {
				if (!ok) failures++;
				lines.push(
					`<span class="${ok ? 'pass' : 'fail'}">${ok ? 'pass' : 'FAIL'}</span>  ${name}` +
						(detail ? `  <span class="note">${detail}</span>` : ''),
				);
			}

			function note(text) {
				lines.push(`<span class="note">${text}</span>`);
			}

			// -- fixed point ------------------------------------------------

			note('— fixed point —');

			{
				const prec = 128;
				let worst = 0;
				for (const v of [0, 1, -1, 0.5, -0.7436438870371587, 3.25, 1e-9, -1e-9, 2 ** -40]) {
					const back = toNumber(fromNumber(v, prec), prec);
					worst = Math.max(worst, Math.abs(back - v));
				}
				check('fromNumber/toNumber round-trips exactly', worst === 0, `max error ${worst}`);
			}

			{
				const prec = 256;
				const a = fromNumber(0.1, prec);
				const b = fromNumber(0.3, prec);
				const err = Math.abs(toNumber(mul(a, b, prec), prec) - 0.03);
				check('mul is accurate', err < 1e-15, `0.1 × 0.3 off by ${err.toExponential(2)}`);
			}

			{
				// 60 digits of a genuinely deep coordinate must survive a
				// round trip through the URL representation.
				const decimal = '-0.743643887037158704752191506114774166308973690483300346161' +
					'6907';
				const prec = 512;
				const round = toDecimalString(fromDecimalString(decimal, prec), prec, 62);
				check(
					'decimal string round-trips at 62 places',
					round.startsWith(decimal),
					round.slice(0, 24) + '…',
				);
			}

			{
				const p = precisionFor(1e-40);
				check('precisionFor(1e-40) has headroom', p >= 133 + 48 && p % 64 === 0, `${p} bits`);
			}

			// -- the reference orbit ----------------------------------------

			note('— reference orbit —');

			{
				// A point known to stay bounded; check against plain doubles.
				const prec = 128;
				const cx = fromNumber(-0.5, prec);
				const cy = fromNumber(0.5, prec);
				const { zr, zi, length } = computeReference({ cx, cy, prec, maxIterations: 40 });

				let r = 0;
				let i = 0;
				let worst = 0;
				for (let n = 1; n <= 40; n++) {
					const ni = 2 * r * i + 0.5;
					r = r * r - i * i - 0.5;
					i = ni;
					worst = Math.max(worst, Math.abs(zr[n] - r), Math.abs(zi[n] - i));
				}
				check(
					'BigInt orbit agrees with the double orbit',
					worst < 1e-12 && length === 41,
					`max divergence ${worst.toExponential(2)}`,
				);
			}

			// -- exact escape, for comparison -------------------------------

			// The slow, obviously-correct version: every iteration in full
			// precision. Far too slow for a whole image, perfect as a referee.
			function exactEscape(cx, cy, prec, maxIterations) {
				const R2 = fromNumber(ESCAPE_RADIUS * ESCAPE_RADIUS, prec);
				let r = 0n;
				let i = 0n;
				let n = 0;
				let modulus2 = 0;

				while (n < maxIterations) {
					const rr = mul(r, r, prec);
					const ii = mul(i, i, prec);
					if (rr + ii > R2) {
						modulus2 = toNumber(rr + ii, prec);
						break;
					}
					const ni = mul(r << 1n, i, prec) + cy;
					r = rr - ii + cx;
					i = ni;
					n++;
				}
				if (n >= maxIterations) return INTERIOR;
				return (
					n -
					Math.log(Math.log(Math.sqrt(modulus2)) / Math.log(ESCAPE_RADIUS)) / Math.LN2
				);
			}

			// -- perturbation vs plain doubles ------------------------------

			note('— perturbation —');

			/** Fraction of pixels where `values` disagrees with the referee. */
			function disagreement(values, referee) {
				let wrong = 0;
				for (let k = 0; k < values.length; k++) {
					const a = values[k];
					const b = referee[k];
					if (a === INTERIOR || b === INTERIOR) {
						if (a !== b) wrong++;
					} else if (Math.abs(a - b) > 0.02) {
						wrong++;
					}
				}
				return wrong / values.length;
			}

			/** Render one tile every way we know how, and referee with exact BigInt. */
			function survey({ cxs, cys, perPixel, maxIterations, size, referee = 256 }) {
				const prec = precisionFor(perPixel);
				const cx = fromDecimalString(cxs, prec);
				const cy = fromDecimalString(cys, prec);
				const dx0 = (-size / 2 + 0.5) * perPixel;
				const dy0 = (-size / 2 + 0.5) * perPixel;

				const started = performance.now();
				const orbit = computeReference({ cx, cy, prec, maxIterations });
				const orbitTime = performance.now() - started;

				const perturbed = perturbTile(
					new Float32Array(size * size),
					size, size, dx0, dy0, perPixel, maxIterations, orbit,
				);
				const direct = directTile(
					new Float32Array(size * size),
					size, size,
					toNumber(cx, prec) + dx0, toNumber(cy, prec) + dy0,
					perPixel, maxIterations,
				);

				// The referee: every iteration in full precision, no shortcuts.
				const exact = new Float32Array(size * size);
				const rx = fromDecimalString(cxs, referee);
				const ry = fromDecimalString(cys, referee);
				const step = fromNumber(perPixel, referee);
				const originX = rx + fromNumber(dx0, referee);
				const originY = ry + fromNumber(dy0, referee);
				for (let row = 0; row < size; row++) {
					for (let col = 0; col < size; col++) {
						exact[row * size + col] = exactEscape(
							originX + BigInt(col) * step,
							originY + BigInt(row) * step,
							referee,
							maxIterations,
						);
					}
				}

				return {
					prec,
					orbit,
					orbitTime,
					pixels: size * size,
					perturbWrong: disagreement(perturbed, exact),
					directWrong: disagreement(direct, exact),
					agreement: 1 - disagreement(perturbed, direct),
				};
			}

			const pct = (f) => (f * 100).toFixed(2) + '%';

			{
				// The opening view, where we still use plain doubles. The two
				// paths have to agree here or the switch would be visible.
				const r = survey({
					cxs: '-0.6', cys: '0', perPixel: 0.0029,
					maxIterations: 300, size: 24, referee: 128,
				});
				check(
					'at the opening view both paths agree exactly',
					r.agreement === 1 && r.directWrong === 0 && r.perturbWrong === 0,
					`${r.pixels} px, agreement ${pct(r.agreement)}`,
				);
			}

			{
				// Deep enough that doubles are visibly struggling.
				const r = survey({
					cxs: '-0.743643887037151', cys: '0.131825904205330',
					perPixel: 1e-11, maxIterations: 3000, size: 40,
				});
				check(
					'perturbation stays accurate at 1e-11/px',
					r.perturbWrong < 0.01,
					`${r.pixels} px refereed · perturbation ${pct(r.perturbWrong)} wrong, ` +
						`plain doubles ${pct(r.directWrong)}`,
				);
				check(
					'and it beats plain doubles by a wide margin',
					r.perturbWrong * 10 < r.directWrong,
					`${(r.directWrong / Math.max(r.perturbWrong, 1e-9)).toFixed(0)}× fewer wrong pixels`,
				);
			}

			{
				// Past anything a double can address at all.
				const r = survey({
					cxs: '-1.7490863748149452878590942294057334028', cys: '0',
					perPixel: 1e-24, maxIterations: 4000, size: 16,
				});
				check(
					'perturbation matches exact BigInt at 1e-24/px',
					r.perturbWrong === 0,
					`${r.prec} bits, orbit of ${r.orbit.length} in ` +
						`${r.orbitTime.toFixed(0)}ms, ${r.pixels} px refereed exactly`,
				);
			}

			{
				// Absurdly deep, to prove nothing structural breaks.
				const r = survey({
					cxs: '-1.749086374814945287859094229405733402857582100', cys: '0',
					perPixel: 1e-60, maxIterations: 2500, size: 10, referee: 512,
				});
				check(
					'perturbation matches exact BigInt at 1e-60/px',
					r.perturbWrong === 0,
					`${r.prec} bits, ~1e60× magnification, ${r.pixels} px refereed exactly`,
				);
			}

			// -- state ------------------------------------------------------

			note('— view state —');

			{
				const state = ViewState.initial(1600, 900);
				let deepest = state;
				for (let n = 0; n < 90; n++) {
					deepest = deepest.clone().zoomTo({ x: 900, y: 500 }, 2, 1600, 900);
				}
				const url = 'https://example.com/?' + deepest.toSearchParams().toString();
				const restored = ViewState.fromURL(url);

				// Compare at the precision the URL actually claims to carry.
				const digits = deepest.significantDigits;
				const same =
					restored &&
					toDecimalString(restored.cx, restored.prec, digits) ===
						toDecimalString(deepest.cx, deepest.prec, digits) &&
					toDecimalString(restored.cy, restored.prec, digits) ===
						toDecimalString(deepest.cy, deepest.prec, digits);

				// …and that must be finer than a pixel by a healthy margin.
				const carried = 10 ** -digits;
				check(
					'a 90-step zoom survives a URL round trip',
					same && carried < deepest.perPixel / 1000,
					`${deepest.prec} bits, ${digits} digits, ` +
						`zoom ${deepest.magnification(1600, 900).toExponential(1)}×`,
				);
				check('deep views select the perturbation path', deepest.deep === true);
				check('the opening view uses plain doubles', state.deep === false);
				check(
					'raising iterations alone switches paths',
					state.clone().setIterations(4000).deep === true,
				);
			}

			{
				const state = ViewState.initial(1600, 900);
				const before = state.maxIterations;
				state.zoomTo({ x: 800, y: 450 }, 2 ** 30, 1600, 900);
				check(
					'automatic iteration count climbs with depth',
					state.maxIterations > before * 3,
					`${before} → ${state.maxIterations}`,
				);
			}

			// -- colour -----------------------------------------------------

			note('— colour —');

			const paint = (values, opts) => {
				const image = new ImageData(values.length, 1);
				colorize(values, image, {
					palette: 'classic',
					density: 1,
					offset: 0,
					maxIterations: 1200,
					...opts,
				});
				return new Uint32Array(image.data.buffer);
			};

			{
				const pixels = paint(new Float32Array([INTERIOR, 1, 12.5, 400, 9000]));
				check(
					'every pixel comes out opaque',
					[...pixels].every((p) => p >>> 24 === 255),
				);
				check('interior pixels are black', pixels[0] === 0xff000000);
				check(
					'escape values map to distinct colours',
					new Set([...pixels].slice(1)).size === 4,
				);
			}

			{
				const { mapping } = await import('./src/palette.js');

				// The colours must not creep as you zoom. What the frame happens
				// to contain must not reach the palette at all -- zooming into a
				// smooth region halves the spread of escape values every step, so
				// a palette that tracked it doubled its scale every step and
				// repainted the picture on every single click (x1, x8, x32, x64,
				// x256 in five). Only the iteration limit gets a say now, and only
				// in doublings.
				const values = new Float32Array([120, 300, 700, 1500]);
				check(
					'the same iteration limit always paints the same colours',
					paint(values, { maxIterations: 900 }).every(
						(p, i) => p === paint(values, { maxIterations: 900 })[i],
					),
				);
				check(
					'a nearby iteration limit paints them the same too',
					paint(values, { maxIterations: 900 }).every(
						(p, i) => p === paint(values, { maxIterations: 1150 })[i],
					),
					`both sit at ×${mapping(900).stretch}`,
				);

				// The two colour controls have to stay independent: frequency
				// changes how often the palette repeats, phase slides it along,
				// and neither may quietly do the other's job.
				const plain = mapping(1200, 1, 0);
				const denser = mapping(1200, 4, 0);
				const shifted = mapping(1200, 1, 0.5);
				check(
					'the bands control scales the colour frequency',
					Math.abs(denser.scale / plain.scale - 4) < 1e-9,
					`×1 → ${plain.scale.toFixed(0)}, ×4 → ${denser.scale.toFixed(0)}`,
				);
				check(
					'and the two colour controls stay independent',
					shifted.scale === plain.scale &&
						shifted.shift !== plain.shift &&
						denser.shift === plain.shift,
					'frequency leaves the phase alone and vice versa',
				);

				// Level 0 is the mapping this program has always used.
				const levels = [300, 1200, 5000, 40000, 150000].map((n) => mapping(n).stretch);
				check(
					'it opens unstretched and adapts in powers of two',
					levels[0] === 1 &&
						levels.every((s) => Number.isInteger(Math.log2(s))) &&
						levels.every((s, i) => i === 0 || s >= levels[i - 1]),
					`300→×${levels[0]}  1.2k→×${levels[1]}  5k→×${levels[2]}  ` +
						`40k→×${levels[3]}  150k→×${levels[4]}`,
				);
			}

			{
				// The spectrum strip is the graphical stand-in for "bands" and
				// "shift": count the repeats, see where the pattern starts. It has
				// to actually repeat the right number of times and start in the
				// right place, or the picture would be lying same as the numbers
				// could.
				const { spectrum } = await import('./src/palette.js');
				const W = 1200; // fine enough that rounding to a pixel index is negligible

				const two = spectrum(W, { palette: 'classic', cycles: 2, offset: 0 });
				check(
					'two cycles returns to the start colour halfway across',
					two[0] === two[Math.round(W / 2)] && two[0] !== two[Math.round(W / 4)],
					'the second repeat begins exactly at the midpoint',
				);

				// offset is a fraction of *one cycle*, not of the strip -- at
				// cycles=1 those coincide, so a quarter-turn offset is a quarter
				// of the width, and this is the simplest place to pin that down.
				const plain = spectrum(W, { palette: 'classic', cycles: 1, offset: 0 });
				const nudged = spectrum(W, { palette: 'classic', cycles: 1, offset: 0.25 });
				check(
					'offset slides the pattern without changing its rate',
					nudged[0] === plain[Math.round(W * 0.25)] &&
						plain.length === nudged.length,
					'a quarter-turn shift reads like starting a quarter of the way in',
				);

				check(
					'every pixel of the strip is opaque',
					[...spectrum(64, { palette: 'ultra', cycles: 2.5, offset: 0.4 })].every(
						(p) => p >>> 24 === 255,
					),
				);

				// A fractional cycle count -- the ordinary case, since it's
				// density × an automatic power-of-two stretch -- must still
				// produce a strip exactly one cycle long when asked for one.
				const fractional = spectrum(W, { palette: 'mono', cycles: 1, offset: 0 });
				const wrap = fractional[fractional.length - 1];
				const start = fractional[0];
				check(
					'a strip of exactly one cycle rejoins itself at the seam',
					Math.abs((wrap & 0xff) - (start & 0xff)) < 8,
					`last pixel and first pixel are one LUT step apart, not a jump`,
				);
			}

			{
				// Deep down everything escapes at nearly the same count. Without
				// the stretch that frame is one flat colour. Distinct colours is
				// the wrong measure -- two neighbouring palette entries count as
				// distinct but look identical -- so measure how far apart they get.
				const spread = (pixels) => {
					let widest = 0;
					for (let channel = 0; channel < 3; channel++) {
						const bytes = [...pixels].map((p) => (p >>> (channel * 8)) & 0xff);
						widest = Math.max(widest, Math.max(...bytes) - Math.min(...bytes));
					}
					return widest;
				};

				const values = new Float32Array([37900, 37950, 38000, 38050, 38100]);
				const flat = spread(paint(values, { maxIterations: 1200 }));
				const stretched = spread(paint(values, { maxIterations: 40000 }));

				check(
					'200 iterations of spread is nearly flat unstretched',
					flat < 12,
					`only ${flat}/255 of colour spread`,
				);
				check(
					'and opens right up at the depth that needs it',
					stretched > 100,
					`${stretched}/255 of colour spread, ${Math.round(stretched / flat)}× more`,
				);
			}

			// -- end to end -------------------------------------------------

			// Everything above calls the kernel directly. This drives the real
			// thing: worker pool, session broadcast, tiling, colouring.

			note('— end to end —');

			{
				const { Renderer } = await import('./src/render.js');
				const seen = [];
				const renderer = new Renderer((e) => seen.push(e));
				renderer.setSize(256, 192);
				const ctx = renderer.surface.getContext('2d');

				const distinctColors = () => {
					const data = new Uint32Array(
						ctx.getImageData(0, 0, 256, 192).data.buffer,
					);
					return new Set(data).size;
				};

				const shallow = ViewState.initial(256, 192);
				await renderer.render(shallow);
				check(
					'a shallow frame renders through the worker pool',
					seen.at(-1)?.type === 'done' && distinctColors() > 50,
					`${renderer.workers} workers, ${distinctColors()} colours, ` +
						`${seen.at(-1)?.elapsed.toFixed(0)}ms`,
				);

				seen.length = 0;
				const deep = ViewState.fromURL(
					'https://x/?x=-1.7490863748149452878590942294057334028&y=0' +
						'&s=1e-24&i=2000&c=ultra',
				);
				await renderer.render(deep);
				const phases = seen.filter((e) => e.type === 'phase').map((e) => e.phase);
				check(
					'a 1e24× frame renders through the worker pool',
					seen.at(-1)?.type === 'done' && distinctColors() > 50,
					`${distinctColors()} colours, ${seen.at(-1)?.elapsed.toFixed(0)}ms`,
				);
				check(
					'the deep frame computed a reference orbit first',
					phases[0] === 'reference' && phases[1] === 'tiles',
					phases.join(' → '),
				);

				const before = distinctColors();
				deep.palette = 'ember';
				check(
					'a palette change re-colours without recomputing',
					renderer.recolor(deep) && distinctColors() !== before,
				);

				// The iteration limit is measured per view, because no function
				// of depth can predict it: at one fixed scale the honest answer
				// ran from 400 to 27,750 depending only on where you pointed.
				// The reported view is the hungry case -- at the depth curve's
				// guess of 4,653 its centre is a black void where a whole
				// mini-Mandelbrot lives.
				const hungry = ViewState.fromURL(
					'https://x/?x=-1.50214936955402554984&y=0.00000000000020391442' +
						'&s=2.139988e-14&a=1',
				);
				const easy = ViewState.fromURL(
					'https://x/?x=-1.7490863748149452878590942294057334028&y=0&s=1e-12&a=1',
				);
				const guessed = hungry.nominalIterations;

				seen.length = 0;
				await renderer.render(hungry);
				const forHungry = seen.find((e) => e.type === 'iterations')?.value;

				seen.length = 0;
				await renderer.render(easy);
				const forEasy = seen.find((e) => e.type === 'iterations')?.value;

				check(
					'a starved view gets its iteration limit raised',
					forHungry > guessed * 2,
					`depth guessed ${guessed}, measured ${forHungry}`,
				);
				check(
					'and an easy one at the same depth gets it cut',
					forEasy < easy.nominalIterations / 4,
					`depth guessed ${easy.nominalIterations}, measured ${forEasy}`,
				);
				check(
					'so the count follows the view, not the depth',
					forHungry > forEasy * 10,
					`${forHungry} against ${forEasy} — ${Math.round(forHungry / forEasy)}× apart`,
				);

				renderer.cancel();
			}

			// -- the zoom transition ----------------------------------------

			note('— zoom transition —');

			{
				const { paceDuration } = await import('./src/view.js');

				check(
					'the move holds its guess until the render speaks up',
					paceDuration(50, 300, null) === 300,
				);
				// It eases towards the estimate rather than snapping, because the
				// estimate is noisy early on. Applied repeatedly it should get
				// there: 300ms in with 600ms left wants a 1060ms move.
				const settleTo = (elapsed, remaining) => {
					let d = 300;
					for (let i = 0; i < 60; i++) d = paceDuration(elapsed, d, remaining);
					return d;
				};
				check(
					'a slow render stretches the move to meet it',
					settleTo(300, 600) > 1000 && paceDuration(300, 300, 600) < settleTo(300, 600),
					`300ms → ${Math.round(settleTo(300, 600))}ms, eased not snapped`,
				);
				check(
					'and shortens again when one turns out easy',
					settleTo(100, 5) < 400,
					`→ ${Math.round(settleTo(100, 5))}ms`,
				);

				// No ceiling. A frame that takes a minute gets a move that takes
				// a minute, so you are still travelling when the pixels arrive
				// instead of parked in front of a blur.
				check(
					'and a really slow one gets a really slow move',
					settleTo(1000, 60_000) > 50_000,
					`60s of rendering → ${(settleTo(1000, 60_000) / 1000).toFixed(0)}s move`,
				);

				// Run the loop the way #tick runs it. Two things must hold.
				//
				// It must never run backwards: progress used to be
				// elapsed/duration, and the duration is revised upward the moment
				// the render admits how slow it is, so progress fell off a cliff.
				//
				// And it must actually arrive. Pacing against the *fraction left*
				// rather than elapsed time reads as equivalent, but feeds back --
				// the duration grows as the end nears, so the move decays towards
				// the finish instead of reaching it. That one spun 1215 frames
				// without ever showing the finished picture.
				let progress = 0;
				let duration = 300;
				let elapsed = 0;
				let last = 0;
				let worstReversal = 0;
				let arrivedAt = null;
				for (let tick = 0; tick < 5000 && arrivedAt === null; tick++) {
					elapsed += 16;
					const remaining = elapsed < 150 ? null : Math.max(0, 900 - (elapsed - 150) * 0.6);
					duration = paceDuration(elapsed, duration, remaining);
					progress += 16 / duration;
					if (progress > 0.998) progress = 1;
					worstReversal = Math.min(worstReversal, progress - last);
					last = progress;
					if (progress >= 1) arrivedAt = elapsed;
				}
				check(
					'and the move never runs backwards while it is stretched',
					worstReversal >= 0,
					`worst step ${worstReversal.toFixed(3)}`,
				);
				check(
					'and it actually arrives',
					arrivedAt !== null,
					arrivedAt === null ? 'never reached the end' : `landed after ${arrivedAt}ms`,
				);
			}

			{
				const { sampleRect } = await import('./src/view.js');
				const W = 800;
				const H = 600;
				const from = ViewState.initial(W, H);
				const nothing = { x: 0, y: 0 };

				const start = sampleRect(from, nothing, from.perPixel, 0, W, H);
				check(
					'the move starts as the whole frame',
					start.x === 0 && start.y === 0 && start.w === W && start.h === H,
				);

				// Clicking a point should end up sampling a box centred on it,
				// half the size. If this is off, the picture slides sideways as
				// it zooms and the handover jumps.
				const pixel = { x: 610, y: 180 };
				const to = from.clone().zoomTo(pixel, 2, W, H);
				const end = sampleRect(from, to.worldDelta(from), to.perPixel, 1, W, H);
				check(
					'and ends centred on the point you clicked',
					Math.abs(end.x + end.w / 2 - pixel.x) < 1e-6 &&
						Math.abs(end.y + end.h / 2 - pixel.y) < 1e-6 &&
						Math.abs(end.w - W / 2) < 1e-6,
					`box ${end.w.toFixed(0)}×${end.h.toFixed(0)} at ` +
						`(${end.x.toFixed(1)}, ${end.y.toFixed(1)})`,
				);

				// No jumps along the way, or the zoom stutters. And the steps
				// should be even: scale interpolates geometrically, so equal
				// steps in the parameter are equal steps to the eye. If this
				// ever fails with a large ratio, something has reintroduced
				// easing, or started interpolating the scale itself.
				let worst = 0;
				let smallest = Infinity;
				let previous = start;
				for (let i = 1; i <= 100; i++) {
					const r = sampleRect(from, to.worldDelta(from), to.perPixel, i / 100, W, H);
					const step = Math.abs(r.w - previous.w);
					worst = Math.max(worst, Math.abs(r.x - previous.x), step);
					smallest = Math.min(smallest, step);
					previous = r;
				}
				check(
					'and moves smoothly in between',
					worst < W / 40,
					`largest step ${worst.toFixed(2)}px of ${W}`,
				);
				check(
					'at an even pace, not winding up',
					worst / smallest < 10,
					`fastest step is ${(worst / smallest).toFixed(1)}× the slowest`,
				);
			}

			{
				// The whole point of the rewrite: a frame is assembled off-screen
				// and only shown when the viewport says so.
				const { Renderer } = await import('./src/render.js');
				const { Viewport } = await import('./src/view.js');

				// The viewport draws on requestAnimationFrame, which a browser
				// stops running entirely in a background tab. Drive it off a
				// timer instead so this page can be checked either way.
				const realFrames = window.requestAnimationFrame;
				window.requestAnimationFrame = (fn) => setTimeout(() => fn(performance.now()), 16);

				const visible = document.createElement('canvas');
				const renderer = new Renderer(() => {});
				const viewport = new Viewport(visible, renderer);
				viewport.setSize(320, 240);

				const checksum = (canvas) => {
					const d = new Uint32Array(
						canvas.getContext('2d').getImageData(0, 0, 320, 240).data.buffer,
					);
					let h = 0;
					for (let i = 0; i < d.length; i += 7) h = (h * 31 + d[i]) | 0;
					return h;
				};

				/** Wait for the screen to catch up with the buffer. False if it never does. */
				const settled = (budget = 15_000) =>
					new Promise((resolve) => {
						const deadline = performance.now() + budget;
						const poll = () => {
							if (renderer.complete && checksum(visible) === checksum(renderer.surface))
								resolve(true);
							else if (performance.now() > deadline) resolve(false);
							else setTimeout(poll, 25);
						};
						poll();
					});

				const first = ViewState.initial(320, 240);
				viewport.go(first, { animate: false });
				const shown = await settled();
				check('the first frame lands on screen', shown && checksum(visible) !== 0);

				// Navigation mutates one state object in place rather than
				// making a new one each time. If the viewport keeps a reference
				// to it instead of a copy, "where we were" and "where we're
				// going" become the same object and the zoom stops animating --
				// which is what happened, and only showed up on back/forward,
				// where popstate does build a fresh object.
				const live = viewport.current();
				const beforeScale = live.perPixel;
				live.zoomTo({ x: 160, y: 120 }, 2, 320, 240);
				check(
					'the viewport keeps its own copy of the view',
					viewport.current().perPixel === beforeScale && live.perPixel !== beforeScale,
					'mutating the caller’s state must not move the viewport',
				);

				// Zoom somewhere expensive enough that the frame can't be instant.
				const next = ViewState.fromURL(
					'https://x/?x=-0.743643887037151&y=0.131825904205330&s=2e-9&i=4000',
				);
				viewport.go(next);
				check(
					'the buffer is seeded before a single tile arrives',
					checksum(renderer.surface) !== 0,
					'incoming tiles land on the outgoing frame, not on blank',
				);

				const arrived = await settled();
				check('an animated zoom settles onto the finished frame', arrived);
				check(
					'the view it reports matches where it landed',
					viewport.current().perPixel === next.perPixel,
				);

				renderer.cancel();
				window.requestAnimationFrame = realFrames;
			}

			document.getElementById('out').innerHTML =
				lines.join('\n') +
				`\n\n<span class="${failures ? 'fail' : 'pass'}">` +
				`${failures ? failures + ' FAILED' : 'all checks passed'}</span>`;
		</script>
	</body>
</html>
